[pytest]
# Pytest configuration for RAG Python Backend
minversion = 7.0
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
    --tb=short
    -v
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test discovery patterns
norecursedirs =
    .git
    .pytest_cache
    .mypy_cache
    __pycache__
    venv
    .venv
    data
    logs
    scripts

# Markers for test categorization
markers =
    unit: marks tests as unit tests (fast, no external dependencies)
    integration: marks tests as integration tests (may use external services)
    e2e: marks tests as end-to-end tests (full application flow)
    slow: marks tests as slow (take significant time to run)
    async: marks tests as asynchronous
    database: marks tests that require database access
    external_api: marks tests that require external API calls

# Async test configuration
asyncio_mode = auto

# Warnings configuration
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:distutils
    ignore::UserWarning:transformers
    ignore::FutureWarning:transformers
    ignore::UserWarning:torch

# Console output configuration
console_output_style = progress
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test timeout (in seconds) for hanging tests
timeout = 300
